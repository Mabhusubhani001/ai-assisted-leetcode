name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-ci:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Clean Dependency Install (npm ci)
        run: npm ci

      - name: Verify Monaco Assets Pipeline
        run: |
          test -f public/vs/loader.js || (echo "Monaco loader.js not found!" && exit 1)
          test -f public/vs/editor/editor.main.js || (echo "Monaco editor.main.js not found!" && exit 1)
          echo "Monaco distribution assets successfully verified."

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Next.js Production Build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_mock_key_for_build_validation_only
          CLERK_SECRET_KEY: sk_test_ci_mock_key_for_build_validation_only
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build
