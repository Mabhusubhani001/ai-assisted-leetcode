services:
  redis:
    image: redis:7-alpine
    container_name: leetcode_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - leetcode_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: leetcode_backend
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - leetcode_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: leetcode_frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - leetcode_network

networks:
  leetcode_network:
    name: leetcode_network
    driver: bridge
