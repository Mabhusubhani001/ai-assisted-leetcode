services:
  redis:
    image: redis:7-alpine
    container_name: leetcode_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - leetcode_network

  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: judge0_server
    restart: always
    privileged: true
    volumes:
      - ./deploy/judge0/judge0.conf:/judge0.conf:ro
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=judge0-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0_secure_password
      - POSTGRES_DB=judge0
      - ENABLE_WAIT_RESULT=true
      - ENABLE_COMPILER_OPTIONS=true
      - MAINTENANCE_MODE=false
    depends_on:
      - redis
      - judge0-db
    networks:
      - leetcode_network

  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: judge0_workers
    restart: always
    command: ["./scripts/workers"]
    privileged: true
    volumes:
      - ./deploy/judge0/judge0.conf:/judge0.conf:ro
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=judge0-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0_secure_password
      - POSTGRES_DB=judge0
      - ENABLE_WAIT_RESULT=true
      - ENABLE_COMPILER_OPTIONS=true
      - MAINTENANCE_MODE=false
    depends_on:
      - redis
      - judge0-db
    networks:
      - leetcode_network

  judge0-db:
    image: postgres:13-alpine
    container_name: judge0_db
    restart: always
    environment:
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0_secure_password
      - POSTGRES_DB=judge0
    volumes:
      - judge0_db_data:/var/lib/postgresql/data
    networks:
      - leetcode_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: leetcode_backend
    restart: always
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      JUDGE0_API_URL: "http://judge0-server:2358"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      judge0-server:
        condition: service_started
    networks:
      - leetcode_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: leetcode_frontend
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      INTERNAL_API_URL: "http://backend:8000"
      NEXT_PUBLIC_APP_URL: "http://dsa.msdevs.mooo.com"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_dG9waWNhbC1wcmF3bi0xNjcuY2xlcmsuYWNjb3VudHMuZGV2JA"
      CLERK_SECRET_KEY: "sk_test_dwlTxbPJ0AVgZITMFoZJ459VIVvH5lK9qKZipPP0EU"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - leetcode_network

volumes:
  judge0_db_data:

networks:
  leetcode_network:
    name: leetcode_network
    driver: bridge
